# Activated with SPRING_PROFILES_ACTIVE=postgres (Docker Compose and Render).
spring:
  datasource:
    # A database call gives up instead of waiting for ever: connecting after 10 s, and a statement whose answer
    # doesn't come within 60 s (a connection dropped without notice, e.g. by the network or a database restart).
    # TCP keep-alive lets idle connections notice such a drop. DB_SSLMODE=require for a database reached over the
    # internet (Neon, Supabase); by default the connection is encrypted when the server offers it.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?connectTimeout=10&socketTimeout=60&tcpKeepAlive=true&sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # small instances: a few connections are plenty and leave room under the database's limit
      maximum-pool-size: 5
      # a request waits at most this long for a free connection (then fails with an error instead of hanging)
      connection-timeout: 10000
      # connections are checked while idle and replaced well before the network or database drops them
      keepalive-time: 60000
      max-lifetime: 600000
  flyway:
    # A migration waits at most 30 s for a table in use (by the version still running during a deploy), then fails with
    # "lock timeout" in the log instead of holding the deploy up; deploying again retries it.
    init-sqls: set lock_timeout = '30s'
